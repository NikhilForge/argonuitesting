<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWAKEN THE LEGEND — 3D Anime Scroll Cinematic</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Three.js r128 & GSAP ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    :root {
      --crimson: #ef4444;
      --gold: #f59e0b;
      --void: #020204;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 900vh;
      background-color: var(--void);
      color: #f8fafc;
      overflow-x: hidden;
      overflow-y: auto !important;
      overscroll-behavior-y: none;
      cursor: grab;
    }

    body:active {
      cursor: grabbing;
    }

    /* Ultra-minimal scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #020204;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #450a0a, #ef4444, #fbbf24, #ef4444, #450a0a);
      border-radius: 2px;
    }

    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-cinzel-dec { font-family: 'Cinzel Decorative', serif; }
    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

    /* Pinned Full-Screen 3D WebGL Canvas */
    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* 2D Sakuga Speed Lines, Slash Flares & Impact Frame Canvas */
    #anime-fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* High-Contrast Anime Impact Frame Flash Backdrop */
    #impact-frame-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.96) 0%, rgba(239,68,68,0.88) 42%, rgba(0,0,0,0.98) 88%);
      mix-blend-mode: hard-light;
    }

    /* Subtle Dark Anime Vignette */
    .cinematic-vignette {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, rgba(2, 2, 4, 0) 45%, rgba(1, 1, 3, 0.86) 100%),
        linear-gradient(180deg, rgba(2, 2, 4, 0.65) 0%, rgba(2, 2, 4, 0) 12%, rgba(2, 2, 4, 0) 88%, rgba(2, 2, 4, 0.85) 100%);
    }

    /* Invisible Scroll Track for Native Scrollbar & GSAP ScrollTrigger */
    #scroll-track {
      position: relative;
      width: 100%;
      height: 900vh;
      z-index: 5;
      pointer-events: none;
    }

    /* Minimal Glass Pill */
    .minimal-pill {
      background: rgba(8, 6, 12, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(239, 68, 68, 0.35);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
    }

    .minimal-pill:hover {
      border-color: rgba(248, 113, 113, 0.9);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }

    /* Climax Shimmer Typography */
    .legend-shimmer {
      background: linear-gradient(
        110deg,
        #ffffff 0%,
        #fde68a 22%,
        #ef4444 48%,
        #ffffff 55%,
        #f59e0b 78%,
        #ffffff 100%
      );
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineSweep 3.2s linear infinite;
      filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.85)) drop-shadow(0 0 12px rgba(245, 158, 11, 0.5));
    }

    @keyframes shineSweep {
      0% { background-position: 0% center; }
      100% { background-position: 220% center; }
    }

    @keyframes wheelDot {
      0% { transform: translateY(0); opacity: 1; }
      70% { transform: translateY(8px); opacity: 0.15; }
      100% { transform: translateY(0); opacity: 0; }
    }

    .wheel-anim {
      animation: wheelDot 1.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
  </style>
</head>
<body>

  <!-- 1. FIXED 3D WEBGL VIEWPORT -->
  <div id="webgl-container"></div>

  <!-- 2. HIGH-CONTRAST ANIME IMPACT FLASH & 2D SAKUGA SPEED-LINE CANVAS -->
  <div id="impact-frame-backdrop"></div>
  <canvas id="anime-fx-canvas"></canvas>

  <!-- 3. SUBTLE DARK CINEMATIC VIGNETTE -->
  <div class="cinematic-vignette"></div>

  <!-- 4. ULTRA-MINIMAL TOP-RIGHT SOUND TOGGLE ICON PILL -->
  <div class="fixed top-5 right-5 z-30 flex items-center gap-2">
    <button
      id="audio-toggle-btn"
      type="button"
      title="Toggle Cinematic Sound"
      aria-label="Toggle Cinematic Sound"
      class="minimal-pill px-3 py-2 rounded-full flex items-center gap-2 cursor-pointer transition-all duration-200 group"
    >
      <span id="audio-indicator-dot" class="w-2 h-2 rounded-full bg-zinc-500 transition-all"></span>
      <svg id="audio-icon-off" class="w-4 h-4 text-zinc-400 group-hover:text-red-400 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 5L6 9H2v6h4l5 4V5z" />
        <line x1="23" y1="9" x2="17" y2="15" />
        <line x1="17" y1="9" x2="23" y2="15" />
      </svg>
      <svg id="audio-icon-on" class="w-4 h-4 text-red-400 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 5L6 9H2v6h4l5 4V5z" />
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
      </svg>
      <span id="audio-label" class="font-mono-tech text-[10px] tracking-widest text-zinc-300">SFX</span>
    </button>
  </div>

  <!-- 5. MINIMAL ANIMATED MOUSE-WHEEL ICON (ONLY VISIBLE AT 0% SCROLL) -->
  <div
    id="initial-scroll-icon"
    class="fixed bottom-10 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center pointer-events-none transition-opacity duration-300"
  >
    <div class="w-5 h-8 rounded-full border border-red-500/60 flex justify-center pt-1.5 bg-black/40 shadow-[0_0_15px_rgba(239,68,68,0.4)]">
      <div class="w-1 h-2 rounded-full bg-red-400 wheel-anim"></div>
    </div>
  </div>

  <!-- 6. SCENE 6 FINAL REVEAL TYPOGRAPHY (ONLY VISIBLE AT 88% - 100%) -->
  <div
    id="climax-overlay"
    class="fixed inset-x-0 bottom-12 z-20 flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200"
  >
    <h1 class="font-cinzel-dec text-2xl sm:text-4xl md:text-5xl font-black tracking-[0.22em] legend-shimmer text-center px-4">
      AWAKEN THE LEGEND.
    </h1>
  </div>

  <!-- 7. RAZOR-THIN INTERACTIVE BOTTOM SCRUB BAR + TINY PERCENTAGE -->
  <div
    id="bottom-scrub-bar"
    title="Click or Drag to Scrub Timeline"
    class="fixed bottom-0 left-0 right-0 h-6 z-30 flex items-end cursor-pointer group"
  >
    <!-- Tiny Percentage Readout -->
    <div class="fixed bottom-2.5 right-4 z-30 pointer-events-none flex items-center gap-1.5 opacity-60 group-hover:opacity-100 transition-opacity">
      <span id="scrub-pct-text" class="font-mono-tech text-[10px] font-bold tracking-widest text-red-400">00%</span>
    </div>

    <!-- Track Background -->
    <div class="w-full h-[3px] group-hover:h-[6px] bg-zinc-900/90 transition-all duration-150 relative overflow-hidden">
      <!-- Scene Dividers -->
      <div class="absolute inset-y-0 left-[16%] w-[1px] bg-white/15"></div>
      <div class="absolute inset-y-0 left-[33%] w-[1px] bg-white/15"></div>
      <div class="absolute inset-y-0 left-[50%] w-[1px] bg-white/15"></div>
      <div class="absolute inset-y-0 left-[68%] w-[1px] bg-white/15"></div>
      <div class="absolute inset-y-0 left-[85%] w-[1px] bg-white/15"></div>
      <!-- Active Progress Bar -->
      <div
        id="scrub-progress-fill"
        class="h-full bg-gradient-to-r from-red-800 via-red-500 to-amber-300 shadow-[0_0_12px_#ef4444]"
        style="width: 0%;"
      ></div>
    </div>
  </div>

  <!-- NATIVE SCROLL TRACK -->
  <main id="scroll-track" aria-hidden="true"></main>

  <script>
    /***************************************************************************
     * 1. MATHEMATICAL UTILITIES & SAKUGA EASING CURVES
     ***************************************************************************/
    const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const norm = (v, min, max) => clamp((v - min) / (max - min), 0, 1);

    const smoothstep = (min, max, v) => {
      const x = norm(v, min, max);
      return x * x * (3 - 2 * x);
    };

    const easeOutExpo = (t) => {
      const x = clamp(t);
      return x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
    };

    const easeInExpo = (t) => {
      const x = clamp(t);
      return x === 0 ? 0 : Math.pow(2, 10 * x - 10);
    };

    const easeInOutQuint = (t) => {
      const x = clamp(t);
      return x < 0.5 ? 16 * x * x * x * x * x : 1 - Math.pow(-2 * x + 2, 5) / 2;
    };

    const bellPulse = (t) => Math.sin(clamp(t) * Math.PI);

    // Authentic Katana Sori curvature along blade height Y (-0.7 to +4.6)
    const getKatanaCurveX = (y) => {
      const ny = clamp((y + 0.7) / 5.3, 0, 1);
      return -Math.pow(ny, 2.15) * 0.48;
    };

    /***************************************************************************
     * 2. PROCEDURAL CONQUEROR'S HAKI & THUNDER SOUND ENGINE (WEB AUDIO API)
     *    - Synthesizes deep Conqueror's Haki distortion bass pulses, sky-split
     *      thunderclaps, mechanical seal shatters, chain clanks, katana SHING,
     *      Divine Departure / Getsuga slash waves, and electrical Haki crackles.
     ***************************************************************************/
    class SakugaAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.unlocked = false;
        this.masterGain = null;
        this.droneFilter = null;
        this.choirGain = null;
        this.lastProgress = 0;
        this.cooldowns = new Map();

        this.milestones = [
          { id: 'hakiPulse1', at: 0.045, type: 'hakiPulse', pitch: 0.9 },
          { id: 'hakiPulse2', at: 0.105, type: 'hakiPulse', pitch: 1.05 },
          { id: 'lock1', at: 0.175, type: 'sealBreak', pitch: 0.95 },
          { id: 'lock2', at: 0.215, type: 'sealBreak', pitch: 1.12 },
          { id: 'lock3', at: 0.255, type: 'sealBreak', pitch: 1.28 },
          { id: 'lock4', at: 0.295, type: 'sealBreak', pitch: 1.48 },
          { id: 'runeIgnite', at: 0.315, type: 'katanaShing', pitch: 1.0 },
          { id: 'explodeStart', at: 0.345, type: 'explodeBurst', pitch: 1.0 },
          { id: 'arcCrackle1', at: 0.39, type: 'lightning' },
          { id: 'arcCrackle2', at: 0.44, type: 'lightning' },
          { id: 'arcCrackle3', at: 0.48, type: 'hakiPulse', pitch: 1.2 },
          { id: 'slash1', at: 0.512, type: 'getsugaSlash', pitch: 0.92 },
          { id: 'slash2', at: 0.534, type: 'getsugaSlash', pitch: 1.12 },
          { id: 'slash3', at: 0.556, type: 'getsugaSlash', pitch: 0.86 },
          { id: 'slash4', at: 0.578, type: 'getsugaSlash', pitch: 1.24 },
          { id: 'slash5', at: 0.600, type: 'getsugaSlash', pitch: 1.04 },
          { id: 'slash6', at: 0.622, type: 'getsugaSlash', pitch: 1.32 },
          { id: 'slash7', at: 0.644, type: 'getsugaSlash', pitch: 0.95 },
          { id: 'slash8', at: 0.666, type: 'getsugaSlash', pitch: 1.42 },
          { id: 'snapHilt', at: 0.72, type: 'metalSlam', pitch: 0.9 },
          { id: 'snapGuard', at: 0.755, type: 'metalSlam', pitch: 1.1 },
          { id: 'snapBlade', at: 0.79, type: 'metalSlam', pitch: 1.3 },
          { id: 'finalBankai', at: 0.822, type: 'bankaiDrop' },
          { id: 'climaxChime', at: 0.89, type: 'katanaShing', pitch: 1.2 }
        ];
      }

      initContext() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.0001;
        this.masterGain.connect(this.ctx.destination);

        const droneGain = this.ctx.createGain();
        droneGain.gain.value = 0.28;

        this.droneFilter = this.ctx.createBiquadFilter();
        this.droneFilter.type = 'lowpass';
        this.droneFilter.frequency.value = 115;
        this.droneFilter.Q.value = 4.8;

        // Deep C1 Sub-Bass + Detuned Sawtooth Haki Spiritual Pressure Pad
        const oscSub = this.ctx.createOscillator();
        oscSub.type = 'sine';
        oscSub.frequency.value = 32.7;

        const oscSaw1 = this.ctx.createOscillator();
        oscSaw1.type = 'sawtooth';
        oscSaw1.frequency.value = 65.41;
        oscSaw1.detune.value = -14;

        const oscSaw2 = this.ctx.createOscillator();
        oscSaw2.type = 'sawtooth';
        oscSaw2.frequency.value = 65.41;
        oscSaw2.detune.value = 14;

        const oscHigh = this.ctx.createOscillator();
        oscHigh.type = 'sine';
        oscHigh.frequency.value = 587.33;
        this.choirGain = this.ctx.createGain();
        this.choirGain.gain.value = 0.001;

        oscSub.connect(this.droneFilter);
        oscSaw1.connect(this.droneFilter);
        oscSaw2.connect(this.droneFilter);
        this.droneFilter.connect(droneGain);
        droneGain.connect(this.masterGain);

        oscHigh.connect(this.choirGain);
        this.choirGain.connect(this.masterGain);

        const now = this.ctx.currentTime;
        oscSub.start(now);
        oscSaw1.start(now);
        oscSaw2.start(now);
        oscHigh.start(now);
      }

      setUIState(active) {
        const dot = document.getElementById('audio-indicator-dot');
        const offIcon = document.getElementById('audio-icon-off');
        const onIcon = document.getElementById('audio-icon-on');
        const label = document.getElementById('audio-label');
        if (!dot) return;
        dot.className = active
          ? 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_10px_#ef4444] animate-ping'
          : 'w-2 h-2 rounded-full bg-zinc-500';
        offIcon.classList.toggle('hidden', active);
        onIcon.classList.toggle('hidden', !active);
        label.textContent = active ? 'ON' : 'SFX';
      }

      toggle() {
        this.initContext();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.enabled = !this.enabled;
        this.unlocked = true;
        const now = this.ctx.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.setTargetAtTime(this.enabled ? 0.62 : 0.0001, now, 0.1);
        this.setUIState(this.enabled);
        if (this.enabled) {
          this.playHakiPulse(1.0);
          this.playKatanaShing(1.0);
        }
        return this.enabled;
      }

      updateScroll(progress, velocity) {
        if (!this.enabled || !this.ctx) {
          this.lastProgress = progress;
          return;
        }
        const now = this.ctx.currentTime;
        const speed = Math.min(Math.abs(velocity), 1.8);
        const cutoff = 95 + progress * 620 + speed * 820;
        this.droneFilter.frequency.setTargetAtTime(cutoff, now, 0.05);
        this.choirGain.gain.setTargetAtTime(0.014 + speed * 0.04 + smoothstep(0.84, 0.96, progress) * 0.055, now, 0.08);

        const prev = this.lastProgress;
        const delta = progress - prev;

        if (Math.abs(delta) > 0.0002 && Math.abs(delta) < 0.4) {
          const forward = delta > 0;
          const nowMs = performance.now();
          for (const m of this.milestones) {
            const crossedFwd = forward && prev < m.at && progress >= m.at;
            const crossedBwd = !forward && prev > m.at && progress <= m.at;
            if (crossedFwd || crossedBwd) {
              const lastT = this.cooldowns.get(m.id) || 0;
              if (nowMs - lastT > 220) {
                this.cooldowns.set(m.id, nowMs);
                if (!forward) {
                  this.playReverseWhoosh(m.pitch || 1.0);
                } else {
                  this.triggerMilestone(m);
                }
              }
            }
          }
        }
        this.lastProgress = progress;
      }

      triggerMilestone(m) {
        switch (m.type) {
          case 'hakiPulse': this.playHakiPulse(m.pitch); break;
          case 'sealBreak': this.playSealBreak(m.pitch); this.playThunderCrack(m.pitch); break;
          case 'katanaShing': this.playKatanaShing(m.pitch); break;
          case 'explodeBurst': this.playHakiPulse(0.85); this.playThunderCrack(0.9); break;
          case 'lightning': this.playLightning(); break;
          case 'getsugaSlash': this.playGetsugaSlash(m.pitch); this.playLightning(); break;
          case 'metalSlam': this.playMetalSlam(m.pitch); this.playThunderCrack(m.pitch); break;
          case 'bankaiDrop': this.playBankaiDrop(); break;
        }
      }

      // Wano-style Conqueror's Haki Warped Sub-Bass Pressure Pulse
      playHakiPulse(pitch = 1.0) {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const mod = this.ctx.createOscillator();
        const modGain = this.ctx.createGain();
        const g = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(145 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(34 * pitch, now + 0.45);

        mod.type = 'sine';
        mod.frequency.setValueAtTime(52, now);
        modGain.gain.setValueAtTime(45, now);

        const lpf = this.ctx.createBiquadFilter();
        lpf.type = 'lowpass';
        lpf.frequency.setValueAtTime(420, now);
        lpf.frequency.exponentialRampToValueAtTime(85, now + 0.45);
        lpf.Q.value = 6.0;

        g.gain.setValueAtTime(0.55, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.48);

        mod.connect(modGain);
        modGain.connect(osc.frequency);
        osc.connect(lpf);
        lpf.connect(g);
        g.connect(this.masterGain);

        osc.start(now);
        mod.start(now);
        osc.stop(now + 0.5);
        mod.stop(now + 0.5);
      }

      // Sharp Sky-Splitting Thunder Crack
      playThunderCrack(pitch = 1.0) {
        const now = this.ctx.currentTime;
        const len = Math.floor(this.ctx.sampleRate * 0.45);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          const env = Math.exp(-i / (len * 0.25));
          data[i] = (Math.random() * 2 - 1) * env * (i % 40 < 8 ? 1.35 : 0.7);
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400 * pitch, now);
        filter.frequency.exponentialRampToValueAtTime(180, now + 0.42);
        filter.Q.value = 1.4;

        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.45, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.44);

        noise.connect(filter);
        filter.connect(g);
        g.connect(this.masterGain);
        noise.start(now);
      }

      playKatanaShing(pitch = 1.0) {
        const now = this.ctx.currentTime;
        [2640, 3960, 5280, 7040].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = i % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(f * 0.86 * pitch, now);
          osc.frequency.exponentialRampToValueAtTime(f * 1.06 * pitch, now + 0.08);
          osc.frequency.exponentialRampToValueAtTime(f * pitch, now + 0.55);
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(0.15 / (i + 1), now + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0005, now + 0.62);
          osc.connect(g);
          g.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.65);
        });
      }

      playSealBreak(pitch = 1.0) {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(680 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.22);
        g.gain.setValueAtTime(0.42, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(g);
        g.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.25);

        for (let i = 0; i < 4; i++) {
          const d = i * 0.03;
          const s = this.ctx.createOscillator();
          const sg = this.ctx.createGain();
          s.type = 'square';
          s.frequency.setValueAtTime((2400 + i * 720) * pitch, now + d);
          s.frequency.exponentialRampToValueAtTime(980, now + d + 0.07);
          sg.gain.setValueAtTime(0.12, now + d);
          sg.gain.exponentialRampToValueAtTime(0.001, now + d + 0.08);
          s.connect(sg);
          sg.connect(this.masterGain);
          s.start(now + d);
          s.stop(now + d + 0.09);
        }
      }

      playGetsugaSlash(pitch = 1.0) {
        const now = this.ctx.currentTime;
        const len = Math.floor(this.ctx.sampleRate * 0.38);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.32));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(480 * pitch, now);
        filter.frequency.exponentialRampToValueAtTime(2900 * pitch, now + 0.09);
        filter.frequency.exponentialRampToValueAtTime(160 * pitch, now + 0.35);
        filter.Q.value = 2.4;

        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.5, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.37);

        noise.connect(filter);
        filter.connect(g);
        g.connect(this.masterGain);
        noise.start(now);

        const whip = this.ctx.createOscillator();
        const wg = this.ctx.createGain();
        whip.type = 'triangle';
        whip.frequency.setValueAtTime(2200 * pitch, now);
        whip.frequency.exponentialRampToValueAtTime(420 * pitch, now + 0.19);
        wg.gain.setValueAtTime(0.24, now);
        wg.gain.exponentialRampToValueAtTime(0.001, now + 0.21);
        whip.connect(wg);
        wg.connect(this.masterGain);
        whip.start(now);
        whip.stop(now + 0.22);
      }

      playLightning() {
        const now = this.ctx.currentTime;
        for (let i = 0; i < 6; i++) {
          const t = now + i * 0.028;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(3600 - i * 440, t);
          osc.frequency.exponentialRampToValueAtTime(110, t + 0.036);
          g.gain.setValueAtTime(0.2, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.038);
          osc.connect(g);
          g.connect(this.masterGain);
          osc.start(t);
          osc.stop(t + 0.042);
        }
      }

      playMetalSlam(pitch = 1.0) {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1050 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(95 * pitch, now + 0.15);
        g.gain.setValueAtTime(0.42, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        osc.connect(g);
        g.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      playBankaiDrop() {
        const now = this.ctx.currentTime;
        const sub = this.ctx.createOscillator();
        const sg = this.ctx.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(240, now);
        sub.frequency.exponentialRampToValueAtTime(20, now + 1.1);
        sg.gain.setValueAtTime(0.95, now);
        sg.gain.exponentialRampToValueAtTime(0.001, now + 1.15);
        sub.connect(sg);
        sg.connect(this.masterGain);
        sub.start(now);
        sub.stop(now + 1.2);

        this.playHakiPulse(0.75);
        this.playThunderCrack(0.8);
        this.playKatanaShing(1.0);
        this.playLightning();
      }

      playReverseWhoosh(pitch = 1.0) {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(130 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(640 * pitch, now + 0.11);
        g.gain.setValueAtTime(0.01, now);
        g.gain.linearRampToValueAtTime(0.14, now + 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc.connect(g);
        g.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.14);
      }
    }

    const audioEngine = new SakugaAudioEngine();

    /***************************************************************************
     * 3. 2D WANO-STYLE CONQUEROR'S HAKI BLACK-RED THUNDER & SAKUGA IMPACT CANVAS
     *    - Renders thick branching black-core / neon-crimson lightning bolts
     *    - Renders concentric Haki pressure shockwave rings
     *    - Renders radial Sakuga speed lines & stark monochrome/crimson Impact Frames
     ***************************************************************************/
    const fxCanvas = document.getElementById('anime-fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    const webglContainer = document.getElementById('webgl-container');
    const impactBackdrop = document.getElementById('impact-frame-backdrop');

    function resizeFxCanvas() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    resizeFxCanvas();

    const IMPACT_MOMENTS = [
      { at: 0.175, width: 0.013, invert: false },
      { at: 0.215, width: 0.013, invert: true },
      { at: 0.255, width: 0.013, invert: false },
      { at: 0.295, width: 0.016, invert: true },
      { at: 0.345, width: 0.018, invert: true },
      { at: 0.512, width: 0.012, invert: false },
      { at: 0.534, width: 0.012, invert: true },
      { at: 0.556, width: 0.012, invert: false },
      { at: 0.578, width: 0.013, invert: true },
      { at: 0.600, width: 0.012, invert: false },
      { at: 0.622, width: 0.013, invert: true },
      { at: 0.644, width: 0.012, invert: false },
      { at: 0.666, width: 0.015, invert: true },
      { at: 0.720, width: 0.012, invert: false },
      { at: 0.755, width: 0.012, invert: false },
      { at: 0.790, width: 0.013, invert: true },
      { at: 0.822, width: 0.028, invert: true }
    ];

    // Helper: Draw a single Wano-style Conqueror's Haki Branching Bolt on 2D Canvas
    // (Outer glowing crimson/magenta halo + medium scarlet body + razor-sharp pitch-black core)
    function drawHakiBolt2D(ctx, x1, y1, x2, y2, thickness, seed, branchDepth = 1) {
      const steps = 11;
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len < 4) return;
      const nx = -dy / len;
      const ny = dx / len;

      const pts = [{ x: x1, y: y1 }];
      for (let i = 1; i < steps; i++) {
        const t = i / steps;
        const s = Math.sin(seed * 37.3 + i * 19.7) * 43758.5453;
        const rand = (s - Math.floor(s)) * 2 - 1;
        const env = Math.sin(t * Math.PI);
        const jitter = rand * Math.min(len * 0.16, 75) * env;
        pts.push({
          x: x1 + dx * t + nx * jitter,
          y: y1 + dy * t + ny * jitter
        });
      }
      pts.push({ x: x2, y: y2 });

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'miter';

      // Pass 1: Wide Neon Crimson-Magenta Aura
      ctx.beginPath();
      pts.forEach((pt, idx) => (idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)));
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.85)';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 28;
      ctx.lineWidth = thickness * 2.9;
      ctx.stroke();

      // Pass 2: Hot Red-Gold Inner Edge
      ctx.beginPath();
      pts.forEach((pt, idx) => (idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)));
      ctx.strokeStyle = '#fb7185';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 12;
      ctx.lineWidth = thickness * 1.45;
      ctx.stroke();

      // Pass 3: Iconic Pitch-Black Conqueror's Haki Core
      ctx.beginPath();
      pts.forEach((pt, idx) => (idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y)));
      ctx.strokeStyle = '#030104';
      ctx.shadowBlur = 0;
      ctx.lineWidth = Math.max(1.5, thickness * 0.68);
      ctx.stroke();
      ctx.restore();

      // Recursive Forked Sub-Branches
      if (branchDepth > 0) {
        for (let b = 2; b < steps - 2; b += 3) {
          const bSeed = Math.sin(seed * 13.1 + b * 41.9) * 1000;
          const bRand = bSeed - Math.floor(bSeed);
          if (bRand > 0.35) {
            const origin = pts[b];
            const branchAngle = Math.atan2(dy, dx) + (bRand - 0.5) * 1.45;
            const branchLen = len * (0.28 + bRand * 0.25);
            drawHakiBolt2D(
              ctx,
              origin.x,
              origin.y,
              origin.x + Math.cos(branchAngle) * branchLen,
              origin.y + Math.sin(branchAngle) * branchLen,
              thickness * 0.55,
              seed + b * 7.1,
              branchDepth - 1
            );
          }
        }
      }
    }

    function renderSakuga2D(p, velocity, time) {
      const w = fxCanvas.width;
      const h = fxCanvas.height;
      const cx = w * 0.5;
      const cy = h * 0.5;
      fxCtx.clearRect(0, 0, w, h);

      let impactStrength = 0;
      let shouldInvert = false;

      for (const imp of IMPACT_MOMENTS) {
        const dist = Math.abs(p - imp.at);
        if (dist < imp.width) {
          const s = 1.0 - dist / imp.width;
          if (s > impactStrength) {
            impactStrength = s;
            shouldInvert = imp.invert;
          }
        }
      }

      if (impactStrength > 0.20) {
        if (shouldInvert && impactStrength > 0.48) {
          webglContainer.style.filter = `contrast(3.8) saturate(0.12) invert(1) hue-rotate(168deg)`;
        } else {
          webglContainer.style.filter = `contrast(${(1.3 + impactStrength * 2.8).toFixed(2)}) brightness(${(1.0 + impactStrength * 0.7).toFixed(2)})`;
        }
        impactBackdrop.style.opacity = (impactStrength * 0.6).toFixed(3);
      } else {
        webglContainer.style.filter = 'none';
        impactBackdrop.style.opacity = '0';
      }

      // 1. Concentric Conqueror's Haki Pressure Ripples (Scene 1 Heartbeats, Scene 2 Shatters, Scene 5 Impact)
      const s1Pulse = Math.pow(Math.max(0, Math.sin(p * 110 + time * 3.5)), 4) * (1 - smoothstep(0.14, 0.18, p));
      const hakiWavePower = clamp(s1Pulse * 0.65 + impactStrength * 1.2 + bellPulse(norm(p, 0.81, 0.87)), 0, 1);

      if (hakiWavePower > 0.08) {
        const maxR = Math.hypot(cx, cy);
        for (let rIdx = 0; rIdx < 3; rIdx++) {
          const waveR = (((time * 1.6 + p * 18 + rIdx * 0.33) % 1.0) * maxR);
          fxCtx.save();
          fxCtx.beginPath();
          fxCtx.arc(cx, cy, waveR, 0, Math.PI * 2);
          fxCtx.strokeStyle = rIdx % 2 === 0
            ? `rgba(239, 68, 68, ${(hakiWavePower * 0.42).toFixed(3)})`
            : `rgba(168, 85, 247, ${(hakiWavePower * 0.32).toFixed(3)})`;
          fxCtx.lineWidth = (2.5 + hakiWavePower * 5.0) * (1 - waveR / maxR);
          fxCtx.stroke();
          fxCtx.restore();
        }
      }

      // 2. Peripheral Sakuga Speed Lines driven by scroll velocity & combat phases
      const combatPhase =
        bellPulse(norm(p, 0.16, 0.34)) * 0.6 +
        bellPulse(norm(p, 0.33, 0.50)) * 0.78 +
        bellPulse(norm(p, 0.50, 0.68)) * 1.0 +
        bellPulse(norm(p, 0.70, 0.86)) * 0.92;

      const speedAlpha = clamp(Math.abs(velocity) * 1.15 + combatPhase * 0.48 + impactStrength * 1.4, 0, 1);

      if (speedAlpha > 0.03) {
        const numSpokes = impactStrength > 0.28 ? 148 : 88;
        const outerR = Math.hypot(cx, cy) * 1.1;
        const innerRBase = Math.min(w, h) * (impactStrength > 0.28 ? 0.15 : 0.33);

        fxCtx.save();
        fxCtx.translate(cx, cy);

        for (let i = 0; i < numSpokes; i++) {
          const seed = Math.sin(i * 91.13 + Math.floor(time * 30 + p * 160) * 17.37) * 43758.5453;
          const rand = seed - Math.floor(seed);
          if (rand > speedAlpha * 0.88) continue;

          const angle = (i / numSpokes) * Math.PI * 2 + rand * 0.035;
          const innerR = innerRBase * (0.72 + rand * 0.55);
          const thick = (1.1 + rand * 4.2) * (1 + impactStrength * 2.5);

          fxCtx.beginPath();
          fxCtx.moveTo(Math.cos(angle) * innerR, Math.sin(angle) * innerR);
          fxCtx.lineTo(Math.cos(angle - 0.007 * thick) * outerR, Math.sin(angle - 0.007 * thick) * outerR);
          fxCtx.lineTo(Math.cos(angle + 0.007 * thick) * outerR, Math.sin(angle + 0.007 * thick) * outerR);
          fxCtx.closePath();

          const colType = i % 4;
          if (colType === 0) {
            fxCtx.fillStyle = `rgba(255, 255, 255, ${(speedAlpha * (0.55 + rand * 0.45)).toFixed(3)})`;
          } else if (colType === 3) {
            fxCtx.fillStyle = `rgba(251, 191, 36, ${(speedAlpha * (0.45 + rand * 0.45)).toFixed(3)})`;
          } else {
            fxCtx.fillStyle = `rgba(239, 68, 68, ${(speedAlpha * (0.48 + rand * 0.5)).toFixed(3)})`;
          }
          fxCtx.fill();
        }
        fxCtx.restore();
      }

      // 3. 2D Wano Conqueror's Haki Black-Red Branching Lightning Forks
      const hakiThunderLevel = clamp(
        s1Pulse * 0.35 +
        bellPulse(norm(p, 0.16, 0.34)) * 0.85 +
        bellPulse(norm(p, 0.34, 0.50)) * 0.75 +
        bellPulse(norm(p, 0.50, 0.68)) * 0.95 +
        bellPulse(norm(p, 0.70, 0.88)) * 1.0 +
        smoothstep(0.86, 0.96, p) * 0.65 +
        impactStrength * 1.2,
        0,
        1
      );

      if (hakiThunderLevel > 0.12) {
        const boltFrameSeed = Math.floor(time * 24 + p * 180);
        const boltCount = Math.floor(2 + hakiThunderLevel * 5 + (impactStrength > 0.3 ? 4 : 0));

        for (let b = 0; b < boltCount; b++) {
          const s = Math.sin((boltFrameSeed + b * 17) * 78.233) * 43758.5453;
          const rand = s - Math.floor(s);
          const angle = (b / boltCount) * Math.PI * 2 + rand * 1.2 + p * 12;
          const startR = (0.04 + (rand * 0.12)) * Math.min(w, h);
          const endR = (0.35 + hakiThunderLevel * 0.48) * Math.hypot(cx, cy);

          const x1 = cx + Math.cos(angle) * startR;
          const y1 = cy + Math.sin(angle) * startR;
          const x2 = cx + Math.cos(angle + (rand - 0.5) * 0.4) * endR;
          const y2 = cy + Math.sin(angle + (rand - 0.5) * 0.4) * endR;

          drawHakiBolt2D(
            fxCtx,
            x1,
            y1,
            x2,
            y2,
            2.2 + hakiThunderLevel * 4.5 + impactStrength * 4.0,
            boltFrameSeed + b * 31.7,
            impactStrength > 0.25 ? 2 : 1
          );
        }
      }

      // 4. 2D Screen-Cleaving Diagonal Divine-Departure / Getsuga Slash Flares in Scene 4 (0.50 -> 0.68)
      if (p > 0.49 && p < 0.69) {
        const slashes2D = [
          { at: 0.512, angle: -0.48, color: '#ef4444' },
          { at: 0.534, angle: 0.58, color: '#ffffff' },
          { at: 0.556, angle: -0.18, color: '#fbbf24' },
          { at: 0.578, angle: 0.78, color: '#ef4444' },
          { at: 0.600, angle: -0.68, color: '#a855f7' },
          { at: 0.622, angle: 0.32, color: '#ffffff' },
          { at: 0.644, angle: -0.82, color: '#ef4444' },
          { at: 0.666, angle: 0.14, color: '#fbbf24' }
        ];
        slashes2D.forEach((sl) => {
          const d = norm(p, sl.at - 0.014, sl.at + 0.016);
          if (d > 0 && d < 1) {
            const flash = bellPulse(d);
            fxCtx.save();
            fxCtx.translate(cx, cy);
            fxCtx.rotate(sl.angle);
            const grad = fxCtx.createLinearGradient(-w, 0, w, 0);
            grad.addColorStop(0, 'rgba(239,68,68,0)');
            grad.addColorStop(0.32, '#ef4444');
            grad.addColorStop(0.5, sl.color);
            grad.addColorStop(0.68, '#ef4444');
            grad.addColorStop(1, 'rgba(239,68,68,0)');
            fxCtx.fillStyle = grad;
            fxCtx.shadowColor = '#ef4444';
            fxCtx.shadowBlur = 45;
            fxCtx.fillRect(-w, -8 * flash, w * 2, 16 * flash);
            // Black Haki slash core line
            fxCtx.fillStyle = '#030105';
            fxCtx.fillRect(-w * 0.85, -2.5 * flash, w * 1.7, 5 * flash);
            fxCtx.restore();
          }
        });
      }
    }

    /***************************************************************************
     * 4. PROCEDURAL TEXTURES (ANIME CUBEMAP, ARCANE RUNE MANDALA, SPRITES)
     ***************************************************************************/
    function createSakugaEnvCube() {
      const size = 256;
      const faces = [];
      for (let i = 0; i < 6; i++) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 0, size);
        grad.addColorStop(0, '#070306');
        grad.addColorStop(0.45, '#2b0810');
        grad.addColorStop(0.5, '#fff1f2');
        grad.addColorStop(0.55, '#450a0a');
        grad.addColorStop(1, '#030204');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        // High-contrast diagonal specular reflection bars for metallic anime sheen
        ctx.save();
        ctx.translate(size / 2, size / 2);
        ctx.rotate((i * Math.PI) / 3 + 0.35);
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 255, 255, 0.95)' : 'rgba(239, 68, 68, 0.9)';
        ctx.fillRect(-size / 2, -16, size, 32);
        ctx.restore();

        faces.push(canvas);
      }
      const cubeTex = new THREE.CubeTexture(faces);
      cubeTex.needsUpdate = true;
      return cubeTex;
    }

    function createGlowSpriteTexture(core = '#ffffff', mid = '#ef4444') {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 2, 64, 64, 60);
      g.addColorStop(0, core);
      g.addColorStop(0.32, mid);
      g.addColorStop(0.72, 'rgba(153, 27, 27, 0.22)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    function createArcaneMandalaTexture() {
      const size = 512;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      const cx = size / 2;
      const cy = size / 2;

      ctx.strokeStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 16;

      [240, 224, 180, 168, 112].forEach((r, idx) => {
        ctx.beginPath();
        ctx.lineWidth = idx % 2 === 0 ? 3.5 : 1.5;
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      });

      // Geometric octagram & runic notches
      for (let k = 0; k < 4; k++) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((k * Math.PI) / 4);
        ctx.lineWidth = 2.2;
        ctx.strokeRect(-130, -130, 260, 260);
        ctx.restore();
      }

      for (let i = 0; i < 36; i++) {
        const ang = (i / 36) * Math.PI * 2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.lineWidth = i % 3 === 0 ? 3 : 1.5;
        ctx.moveTo(0, -182);
        ctx.lineTo(0, -220);
        ctx.stroke();
        ctx.restore();
      }

      return new THREE.CanvasTexture(c);
    }

    /***************************************************************************
     * 5. CUSTOM GLSL SHADERS
     *    - A. Crimson Eclipse Corona Backdrop Shader
     *    - B. Sky-Splitting Thunderstorm Vortex Dome Shader ("Heavens Split")
     *    - C. Voronoi Magma & Haki Crack Dissolve Seal Shader (Scene 1 & 2)
     *    - D. Katana Armament Haki (Ryou), Hamon Edge & Rune Sweep Shader
     *    - E. Enma Violet-Crimson-Gold Reiatsu/Haki Flame Cloak Shader
     *    - F. Getsuga / Divine Departure Haki Crescent Slash Wave Shader
     ***************************************************************************/
    const eclipseBackdropShader = {
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uIntensity;
        varying vec2 vUv;

        void main() {
          vec2 p = vUv * 2.0 - 1.0;
          float r = length(p);
          float angle = atan(p.y, p.x);

          float disc = smoothstep(0.40, 0.43, r);
          float corona = exp(-max(r - 0.41, 0.0) * 4.2);
          float rays = 0.72 + 0.28 * sin(angle * 18.0 + uTime * 1.8) * cos(angle * 11.0 - uTime * 2.5);
          float ringRim = smoothstep(0.045, 0.0, abs(r - 0.42));

          vec3 crimson = vec3(0.98, 0.07, 0.16);
          vec3 violet = vec3(0.68, 0.14, 0.88);
          vec3 goldWhite = vec3(1.0, 0.90, 0.74);

          vec3 baseCorona = mix(crimson, violet, 0.35 + 0.35 * sin(angle * 4.0 - uTime));
          vec3 col = mix(baseCorona * rays, goldWhite, ringRim) * (corona * 1.55 + ringRim * 2.4) * disc * uIntensity;
          float alpha = clamp((corona * 0.88 + ringRim) * disc * smoothstep(1.0, 0.45, r), 0.0, 0.94);
          gl_FragColor = vec4(col, alpha);
        }
      `
    };

    // Sky-Splitting Thunderstorm Vortex Dome Shader (Wano Roof "Heavens Split")
    const stormSkySplitShader = {
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vPos;
        void main() {
          vUv = uv;
          vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uSkySplit;   // 0..1 parts the storm clouds down the center
        uniform float uFlash;      // Cloud-to-cloud thunder flash intensity
        varying vec2 vUv;
        varying vec3 vPos;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }

        void main() {
          vec2 p = vUv * 2.0 - 1.0;
          float r = length(p);
          float angle = atan(p.y, p.x);

          // Swirling vortex storm clouds
          float swirl = angle + r * 3.5 - uTime * 0.55;
          vec2 uvSwirl = vec2(cos(swirl), sin(swirl)) * r * 3.0;
          float n1 = noise(uvSwirl * 2.2 + uTime * 0.3);
          float n2 = noise(uvSwirl * 5.5 - uTime * 0.7);
          float cloud = n1 * 0.65 + n2 * 0.35;

          // Sky-Split Chasm along p.x == 0 when Conqueror's Haki clashes
          float splitWidth = uSkySplit * 0.36;
          float splitEdge = smoothstep(splitWidth, splitWidth + 0.18, abs(p.x + sin(p.y * 4.0 + uTime) * 0.06));
          float chasmGlow = smoothstep(splitWidth + 0.16, splitWidth * 0.25, abs(p.x)) * uSkySplit;

          // Internal lightning veins inside the thunderclouds
          float vein = smoothstep(0.62, 0.78, n2) * (0.45 + uFlash * 1.9);

          vec3 darkCloud = vec3(0.03, 0.01, 0.05);
          vec3 crimsonThunder = vec3(0.98, 0.08, 0.18);
          vec3 hakiViolet = vec3(0.65, 0.12, 0.92);
          vec3 splitRift = vec3(1.0, 0.85, 0.78);

          vec3 col = mix(darkCloud, mix(crimsonThunder, hakiViolet, n1), vein);
          col = mix(col, splitRift, chasmGlow * 0.85);

          float radialMask = smoothstep(1.0, 0.25, r);
          float alpha = clamp((cloud * 0.75 * splitEdge + chasmGlow * 0.85) * radialMask, 0.0, 0.9);
          gl_FragColor = vec4(col * 1.8, alpha);
        }
      `
    };

    const sealCrackShader = {
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uHeartbeat;
        uniform float uCrackAmount;
        varying vec2 vUv;

        void main() {
          float cell = abs(sin(vUv.x * 28.0 + sin(vUv.y * 19.0)) * cos(vUv.y * 24.0 + uTime * 2.0));
          float crackMask = smoothstep(0.22 * uCrackAmount + 0.03, 0.0, cell);
          float pulse = 0.45 + 0.55 * sin(uTime * 5.0) * uHeartbeat;

          vec3 darkIron = vec3(0.05, 0.03, 0.07);
          vec3 crimsonVein = vec3(0.98, 0.09, 0.18);
          vec3 whiteMagma = vec3(1.0, 0.92, 0.82);

          vec3 col = mix(darkIron, crimsonVein, pulse * 0.55 + crackMask * 0.68);
          col = mix(col, whiteMagma, crackMask * uCrackAmount * 1.6);

          float alpha = 1.0 - smoothstep(0.82, 1.0, uCrackAmount * (1.0 - cell));
          gl_FragColor = vec4(col * (1.0 + uCrackAmount * 2.4), alpha);
        }
      `
    };

    const katanaHamonShader = {
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uEdgeGlint;
        uniform float uRuneSweep;
        uniform float uBankaiHot;
        varying vec2 vUv;

        void main() {
          float wave1 = sin(vUv.y * 46.0 + sin(vUv.y * 16.0)) * 0.16;
          float wave2 = cos(vUv.y * 92.0 - uTime * 5.5) * 0.07;
          float hamonLine = smoothstep(0.25, 0.02, abs(vUv.x - (0.5 + wave1 + wave2)));

          float runeNotch = step(0.64, fract(vUv.y * 18.0)) * smoothstep(0.35, 0.05, abs(vUv.x - 0.35));

          float dimFlicker = (0.20 + 0.20 * sin(uTime * 11.0 + vUv.y * 22.0)) * (hamonLine + runeNotch);
          float glintBand = smoothstep(0.09, 0.0, abs(vUv.y - uEdgeGlint)) * hamonLine * 2.6;

          float sweepMask = smoothstep(vUv.y - 0.07, vUv.y + 0.01, uRuneSweep);
          float sweepHead = smoothstep(0.08, 0.0, abs(vUv.y - uRuneSweep)) * step(0.01, uRuneSweep) * step(uRuneSweep, 0.99);

          float activeGlow = (hamonLine + runeNotch * 0.95) * sweepMask * (0.78 + 0.22 * sin(vUv.y * 30.0 - uTime * 12.0));
          float totalIntensity = max(dimFlicker, activeGlow) + glintBand + sweepHead * 3.2 + uBankaiHot * 2.1;

          vec3 crimson = vec3(1.0, 0.08, 0.16);
          vec3 enmaViolet = vec3(0.75, 0.15, 0.95);
          vec3 gold = vec3(1.0, 0.80, 0.28);
          vec3 white = vec3(1.0, 0.97, 0.95);

          vec3 col = mix(crimson, enmaViolet, 0.35 + 0.35 * sin(vUv.y * 12.0 - uTime * 4.0));
          col = mix(col, gold, clamp(runeNotch * 0.65 + sweepHead * 0.5, 0.0, 1.0));
          col = mix(col, white, clamp(glintBand + sweepHead + uBankaiHot * 0.65, 0.0, 1.0));

          gl_FragColor = vec4(col * (1.5 + totalIntensity), clamp(totalIntensity, 0.0, 1.0));
        }
      `
    };

    const reiatsuFlameShader = {
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewDir;
        uniform float uTime;
        void main() {
          vUv = uv;
          vec3 pos = position;
          float disp = sin(pos.y * 6.5 - uTime * 14.0 + pos.x * 5.0) * 0.11;
          pos.x += normal.x * disp;
          pos.z += normal.z * disp;
          vec4 worldPos = modelMatrix * vec4(pos, 1.0);
          vNormal = normalize(normalMatrix * normal);
          vViewDir = normalize(cameraPosition - worldPos.xyz);
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uStrength;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewDir;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }

        void main() {
          float fresnel = pow(1.0 - abs(dot(vNormal, vViewDir)), 1.5);
          float n1 = noise(vec2(vUv.x * 9.0, vUv.y * 16.0 - uTime * 8.5));
          float n2 = noise(vec2(vUv.x * 18.0 - uTime * 4.0, vUv.y * 32.0 - uTime * 14.0));
          float flame = n1 * 0.65 + n2 * 0.35;

          vec3 voidBlack = vec3(0.02, 0.01, 0.04);
          vec3 crimson = vec3(0.98, 0.07, 0.16);
          vec3 enmaPurple = vec3(0.72, 0.12, 0.96);
          vec3 goldWhite = vec3(1.0, 0.9, 0.72);

          float rim = smoothstep(0.20, 0.68, flame * fresnel * 2.0);
          float core = smoothstep(0.64, 0.90, flame * fresnel * 2.3);

          vec3 midTone = mix(crimson, enmaPurple, 0.42 + 0.38 * sin(vUv.y * 10.0 - uTime * 6.0));
          vec3 col = mix(voidBlack, midTone, rim);
          col = mix(col, goldWhite, core);

          float alpha = smoothstep(0.14, 0.62, flame * (0.55 + fresnel)) * uStrength;
          gl_FragColor = vec4(col * 2.6, clamp(alpha, 0.0, 0.95));
        }
      `
    };

    const getsugaSlashShader = {
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;

        }

      fragmentShader: `
        uniform float uTime;
        uniform float uSlashAlpha;
        varying vec2 vUv;

        void main() {
          float radial = smoothstep(0.0, 0.24, vUv.y) * smoothstep(1.0, 0.50, vUv.y);
          float ends = smoothstep(0.0, 0.15, vUv.x) * smoothstep(1.0, 0.85, vUv.x);
          float jag = 0.70 + 0.30 * sin(vUv.x * 74.0 - uTime * 32.0);
          float hotEdge = smoothstep(0.56, 0.86, radial * jag);

          vec3 blackVoid = vec3(0.02, 0.0, 0.03);
          vec3 redPlasma = vec3(1.0, 0.06, 0.16);
          vec3 violetFlame = vec3(0.75, 0.12, 0.95);
          vec3 whiteTip = vec3(1.0, 0.96, 0.92);

          vec3 auraCol = mix(redPlasma, violetFlame, 0.35 * sin(vUv.x * 20.0 + uTime * 10.0) + 0.35);
          vec3 col = mix(auraCol, blackVoid, smoothstep(0.26, 0.62, vUv.y));
          col = mix(col, whiteTip, hotEdge);

          float alpha = radial * ends * jag * uSlashAlpha;
          gl_FragColor = vec4(col * 3.0, clamp(alpha, 0.0, 0.96));
        }
      `
    };

    /***************************************************************************

    const scene = new THREE.Scene();

    /***************************************************************************

        originPos,

      const shape = new THREE.Shape();
      const steps = 8;
      const width = isEdge ? 0.22 : 0.25;
      const xOffset = isEdge ? 0.14 : -0.09;

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const y = lerp(yStart, yEnd, t);
        const cx = getKatanaCurveX(y) + xOffset;
        if (i === 0) shape.moveTo(cx, y);
        else shape.lineTo(cx, y);
      }
      for (let i = steps; i >= 0; i--) {
        const t = i / steps;
        const y = lerp(yStart, yEnd, t);
        const taper = y > 2.9 ? lerp(1.0, 0.14, (y - 2.9) / 1.65) : 1.0;
        const cx = getKatanaCurveX(y) + xOffset + (isEdge ? width * taper : -width * taper);
        shape.lineTo(cx, y);
      }
      shape.closePath();

      const geo = new THREE.ExtrudeGeometry(shape, {
        steps: 1,
        depth: isEdge ? 0.035 : 0.078,
        bevelEnabled: true,
        bevelThickness: 0.022,
        bevelSize: 0.02,
        bevelSegments: 2
      });

      const mesh = new THREE.Mesh(geo, isEdge ? matRazorSteel : matObsidianArmor);

      mesh.position.set(getKatanaCurveX(midY) + (isEdge ? 0.18 : -0.12), midY, sideZ);

     * 10. HYBRID DUAL-SYNC SCROLL ENGINE (100% RELIABLE WHEEL, TOUCH, KEYBOARD,

     ***************************************************************************/
    const scrollState = {
      targetProgress: 0,
      smoothProgress: 0,
      velocity: 0,
      lastWheelTime: 0
    };

    gsap.registerPlugin(ScrollTrigger);

    function syncWindowScrollToProgress(p) {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (maxScroll > 0) {
        window.scrollTo({ top: p * maxScroll, behavior: 'auto' });
      }
    }

    function setTargetProgress(newP, syncNative = true) {
      scrollState.targetProgress = clamp(newP, 0, 1);
      scrollState.lastWheelTime = performance.now();
      if (syncNative) {
        syncWindowScrollToProgress(scrollState.targetProgress);
      }
    }

    // A. GSAP ScrollTrigger for native scrollbar dragging
    ScrollTrigger.create({
      trigger: '#scroll-track',
      start: 'top top',
      end: 'bottom bottom',
      scrub: 0.2,
      onUpdate: (self) => {
        // Only accept native scroll updates if not actively overridden by direct wheel within last 80ms
        if (performance.now() - scrollState.lastWheelTime > 80) {
          scrollState.targetProgress = clamp(self.progress, 0, 1);
        }
      }
    });

    // B. Direct Global Mouse Wheel Listener (works even if iframe blocks body scroll)
    window.addEventListener(
      'wheel',
      (e) => {
        e.preventDefault();
        const delta = e.deltaY || e.detail || (-e.wheelDelta);
        // Normalize wheel delta across mouse wheels & trackpads
        const step = clamp(delta, -160, 160) * 0.00065;
        setTargetProgress(scrollState.targetProgress + step, true);
      },
      { passive: false }
    );

    // C. Touch Swipe Support for Mobile & Tablets
    let touchStartY = 0;
    let touchStartProgress = 0;
    window.addEventListener(
      'touchstart',
      (e) => {
        if (e.touches.length > 0) {
          touchStartY = e.touches[0].clientY;
          touchStartProgress = scrollState.targetProgress;
        }
      },
      { passive: true }
    );

    window.addEventListener(
      'touchmove',
      (e) => {
        if (e.touches.length > 0) {
          const dy = touchStartY - e.touches[0].clientY;
          const deltaP = (dy / window.innerHeight) * 0.42;
          setTargetProgress(touchStartProgress + deltaP, true);
        }
      },
      { passive: true }
    );

    // D. Click-and-Drag Vertical Scrubbing anywhere on the 3D scene OR on Bottom Scrub Bar
    let isDraggingViewport = false;
    let isDraggingScrubBar = false;
    let dragStartY = 0;
    let dragStartP = 0;

    const bottomScrubBar = document.getElementById('bottom-scrub-bar');
    bottomScrubBar.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      isDraggingScrubBar = true;
      setTargetProgress(e.clientX / window.innerWidth, true);
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#audio-toggle-btn') || e.target.closest('#bottom-scrub-bar')) return;
      isDraggingViewport = true;
      dragStartY = e.clientY;
      dragStartP = scrollState.targetProgress;
    });

    window.addEventListener('pointermove', (e) => {
      if (isDraggingScrubBar) {
        setTargetProgress(e.clientX / window.innerWidth, true);
      } else if (isDraggingViewport) {
        const dy = dragStartY - e.clientY;
        setTargetProgress(dragStartP + (dy / window.innerHeight) * 0.55, true);
      }
    });

    window.addEventListener('pointerup', () => {
      isDraggingScrubBar = false;
      isDraggingViewport = false;
    });
