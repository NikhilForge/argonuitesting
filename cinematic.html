    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        e.preventDefault();
        setTargetProgress(scrollState.targetProgress + 0.025, true);
      } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        e.preventDefault();
        setTargetProgress(scrollState.targetProgress - 0.025, true);
      } else if (e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        setTargetProgress(scrollState.targetProgress + 0.08, true);
      } else if (e.key === 'PageUp') {
        e.preventDefault();
        setTargetProgress(scrollState.targetProgress - 0.08, true);
      } else if (e.key === 'Home') {
        e.preventDefault();
        setTargetProgress(0, true);
      } else if (e.key === 'End') {
        e.preventDefault();
        setTargetProgress(1, true);
      }
    });

    /***************************************************************************
     * 11. MASTER 6-SCENE ANIME FIGHT TIMELINE EVALUATION (p = 0.0 -> 1.0)
     ***************************************************************************/
    const domInitialIcon = document.getElementById('initial-scroll-icon');
    const domClimaxOverlay = document.getElementById('climax-overlay');
    const domScrubFill = document.getElementById('scrub-progress-fill');
    const domScrubPct = document.getElementById('scrub-pct-text');

    function updateMinimalUI(p) {
      const pct = Math.round(p * 100);
      domScrubFill.style.width = `${(p * 100).toFixed(2)}%`;
      domScrubPct.textContent = `${pct < 10 ? '0' + pct : pct}%`;
      domInitialIcon.style.opacity = p < 0.02 ? '1' : '0';
      domClimaxOverlay.style.opacity = smoothstep(0.88, 0.94, p).toFixed(3);
    }

    function evaluateAnimeTimeline(p, time) {
      // -----------------------------------------------------------------------
      // A. DYNAMIC ANIME CAMERA CHOREOGRAPHY (DUTCH TILTS, WHIP-PANS, FOV)
      // -----------------------------------------------------------------------
      let camRadius = 12.5;
      let camAngle = 0.0;
      let camY = 0.4;
      let lookY = 0.6;
      let dutchTilt = 0.0;
      let targetFov = 45;

      if (p < 0.16) {
        // Scene 1: Tense push-in toward the sealed sword before the Crimson Eclipse
        const t = norm(p, 0.0, 0.16);
        camRadius = lerp(13.2, 6.8, easeOutExpo(t));
        camY = lerp(-0.5, 0.5, t);
        camAngle = lerp(-0.2, 0.16, t);
        lookY = lerp(0.4, 1.2, t);
        dutchTilt = lerp(-0.12, 0.08, t);
        targetFov = lerp(42, 48, t);
      } else if (p < 0.33) {
        // Scene 2: Close-up whip-cuts tracking each shattering Voronoi seal
        const t = norm(p, 0.16, 0.33);
        camRadius = lerp(6.8, 5.1, smoothstep(0, 1, t));
        camY = lerp(0.5, 1.95, easeInOutQuint(t));
        camAngle = lerp(0.16, 1.05, easeInOutQuint(t));
        lookY = lerp(1.2, 1.6, t);
        dutchTilt = Math.sin(t * Math.PI * 4) * 0.24;
        targetFov = 52;
      } else if (p < 0.50) {
        // Scene 3: Wide dramatic FOV pull-back as 28+ sword parts explode outward
        const t = norm(p, 0.33, 0.50);
        camRadius = lerp(5.1, 11.2, easeOutExpo(t));
        camY = lerp(1.95, -0.5, easeOutExpo(t));
        camAngle = lerp(1.05, 2.4, easeOutExpo(t));
        lookY = lerp(1.6, 0.3, t);
        dutchTilt = lerp(0.24, -0.28, t);
        targetFov = lerp(52, 65, bellPulse(t));
      } else if (p < 0.68) {
        // Scene 4: High-octane orbital whip-pan around the Getsuga Slash Vortex
        const t = norm(p, 0.50, 0.68);
        camRadius = lerp(11.2, 8.8, Math.sin(t * Math.PI));
        camY = Math.cos(t * Math.PI * 4) * 2.1;
        camAngle = lerp(2.4, 6.2, easeInOutQuint(t));
        lookY = 0.45;
        dutchTilt = Math.sin(t * Math.PI * 5) * 0.35;
        targetFov = 58 + Math.sin(t * Math.PI * 6) * 9;
      } else if (p < 0.85) {
        // Scene 5: Hypersonic magnetic convergence zoom & Bankai impact pushback
        const t = norm(p, 0.68, 0.85);
        const slamSnap = smoothstep(0.79, 0.835, p);
        camRadius = lerp(8.8, 4.9, easeInExpo(norm(p, 0.68, 0.81))) + slamSnap * 4.2;
        camY = lerp(-0.3, -0.6, t);
        camAngle = lerp(6.2, 6.8, t);
        lookY = lerp(0.45, -0.4, t) + slamSnap * 0.85;
        dutchTilt = lerp(-0.22, 0.0, slamSnap);
        targetFov = 46 + bellPulse(norm(p, 0.805, 0.85)) * 24;
      } else {
        // Scene 6: Smooth 360-degree heroic orbit around the Awakened Legend
        const t = norm(p, 0.85, 1.0);
        camRadius = lerp(9.1, 9.8, smoothstep(0, 1, t));
        camY = lerp(-0.6, -0.25, t);
        camAngle = lerp(6.8, 6.8 + Math.PI * 2.0, easeInOutQuint(t));
        lookY = 0.35;
        dutchTilt = -0.06;
        targetFov = 45;
      }

      // Camera punch shake during seal breaks, Getsuga slashes & Bankai slam
      const shakeAmp =
        bellPulse(norm(p, 0.16, 0.32)) * 0.14 +
        bellPulse(norm(p, 0.50, 0.68)) * 0.13 +
        bellPulse(norm(p, 0.80, 0.86)) * 0.36;

      camera.fov = lerp(camera.fov, targetFov, 0.25);
      camera.updateProjectionMatrix();

      camera.position.set(
        Math.sin(camAngle) * camRadius + Math.sin(time * 68) * shakeAmp,
        camY + Math.cos(time * 62) * shakeAmp,
        Math.cos(camAngle) * camRadius
      );
      camera.lookAt(0, lookY, 0);
      camera.rotation.z += dutchTilt;

      // Keep Crimson Eclipse Moon facing camera in background
      eclipseMesh.position.set(
        -Math.sin(camAngle) * 16,
        1.5 - camY * 0.4,
        -Math.cos(camAngle) * 16
      );
      eclipseMesh.lookAt(camera.position);
      eclipseUniforms.uTime.value = time;
      eclipseUniforms.uIntensity.value = 0.85 + p * 0.65 + bellPulse(norm(p, 0.80, 0.88)) * 1.1;

      // Overhead Sky-Splitting Thunderstorm Canopy
      stormSkyUniforms.uTime.value = time;
      stormSkyUniforms.uSkySplit.value = smoothstep(0.46, 0.58, p) * 0.85 + bellPulse(norm(p, 0.81, 0.88)) * 0.45;
      stormSkyUniforms.uFlash.value =
        Math.pow(Math.max(0, Math.sin(time * 14 + p * 85)), 6) + bellPulse(norm(p, 0.81, 0.86)) * 1.8;

      // Sweep key light for moving metallic specular reflections
      keyLight.position.set(Math.sin(camAngle + 0.85) * 11, 7.5, Math.cos(camAngle + 0.85) * 11);

      // Armament Haki (Ryou) Black-Blade Metallic Infusion as sword awakens
      const hakiBlackBladeMix = smoothstep(0.24, 0.55, p);
      matRazorSteel.color.setRGB(
        lerp(0.88, 0.12, hakiBlackBladeMix),
        lerp(0.91, 0.04, hakiBlackBladeMix),
        lerp(0.95, 0.08, hakiBlackBladeMix)
      );
      matRazorSteel.emissiveIntensity = 0.18 + hakiBlackBladeMix * 0.58 + bellPulse(norm(p, 0.80, 0.86)) * 1.2;
      matObsidianArmor.emissiveIntensity = 0.25 + hakiBlackBladeMix * 0.65;

      // -----------------------------------------------------------------------
      // B. SWORD ROOT STANCE & MICRO-BOBBING
      // -----------------------------------------------------------------------
      const slashFightBlend = bellPulse(norm(p, 0.49, 0.69));
      const bankaiPoseBlend = smoothstep(0.82, 0.90, p);

      swordRoot.position.x = Math.sin(time * 50) * (1 - smoothstep(0.15, 0.28, p)) * 0.03;
      swordRoot.position.y = Math.sin(time * 2.4 + p * 8.0) * 0.09;

      swordRoot.rotation.x = Math.sin(p * 90) * 0.95 * slashFightBlend + bankaiPoseBlend * 0.18;
      swordRoot.rotation.y = p * 0.85 + slashFightBlend * Math.sin(p * 65) * 1.5;
      swordRoot.rotation.z = Math.cos(p * 78) * 1.15 * slashFightBlend - bankaiPoseBlend * 0.36;

      // -----------------------------------------------------------------------
      // C. SCENE 1 & 2: 4 VORONOI MAGMA SEALS & SPRING-PHYSICS CHAINS
      // -----------------------------------------------------------------------
      let activeBurstIntensity = 0;
      let activeBurstY = 0.5;
      let activeBurstProgress = 0;

      sealLocks.forEach((seal, idx) => {
        seal.uniforms.uTime.value = time + idx * 1.7;
        const crackT = smoothstep(seal.unlockStart - 0.03, seal.unlockStart + 0.015, p);
        const releaseT = easeOutExpo(smoothstep(seal.unlockStart, seal.unlockEnd, p));

        seal.uniforms.uCrackAmount.value = crackT;
        seal.halfL.position.x = -releaseT * 2.8;
        seal.halfR.position.x = releaseT * 2.8;
        seal.halfL.rotation.z = releaseT * 0.95;
        seal.halfR.rotation.z = -releaseT * 0.95;
        seal.group.rotation.y = p * 8.0 * (idx % 2 === 0 ? 1 : -1);

        seal.hexRing.rotation.z = time * 2.2 + p * 14.0;
        seal.hexRing.scale.setScalar(1.0 + releaseT * 2.6);
        seal.hexRing.material.opacity = (1.0 - releaseT) * 0.85;
        seal.hazeSprite.material.opacity = (1.0 - releaseT) * (0.35 + 0.2 * Math.sin(time * 6 + idx));
        seal.group.visible = releaseT < 0.98;

        const burstW = norm(p, seal.unlockStart, seal.unlockStart + 0.035);
        if (burstW > 0 && burstW < 1) {
          activeBurstIntensity = bellPulse(burstW);
          activeBurstY = seal.baseY;
          activeBurstProgress = burstW;
        }
      });

      suppressionChains.forEach((ch) => {
        const sealMeta = sealLocks[ch.sealIdx];
        const chainT = smoothstep(sealMeta.unlockStart, sealMeta.unlockEnd + 0.065, p);
        if (chainT <= 0.001) {
          ch.mesh.visible = true;
          ch.mesh.position.copy(ch.originPos);
          ch.mesh.rotation.set(ch.originRot.x, ch.originRot.y, ch.originRot.z);
        } else if (chainT >= 0.99) {
          ch.mesh.visible = false;
        } else {
          ch.mesh.visible = true;
          const springSwing = Math.sin(chainT * Math.PI * 4) * (1 - chainT) * 0.45;
          ch.mesh.position.x = ch.originPos.x + (ch.outDir.x + springSwing) * chainT * 5.4;
          ch.mesh.position.y = ch.originPos.y + ch.outDir.y * chainT * 3.2 - chainT * chainT * 6.5;
          ch.mesh.position.z = ch.originPos.z + ch.outDir.z * chainT * 5.4;
          ch.mesh.rotation.x = ch.originRot.x + chainT * 9.0;
          ch.mesh.rotation.y = ch.originRot.y + chainT * 7.0;
        }
      });

      // -----------------------------------------------------------------------
      // D. HAMON EDGE GLINT, RUNE SWEEP & BLACK-CRIMSON FLAME AURA
      // -----------------------------------------------------------------------
      hamonUniforms.uEdgeGlint.value = (p * 6.5) % 1.0;
      hamonUniforms.uRuneSweep.value = smoothstep(0.165, 0.32, p);
      hamonUniforms.uBankaiHot.value =
        bellPulse(norm(p, 0.79, 0.86)) * 1.4 + smoothstep(0.84, 0.95, p) * 0.85;

      flameUniforms.uStrength.value = clamp(
        bellPulse(norm(p, 0.24, 0.36)) * 0.7 + smoothstep(0.48, 0.56, p) * 0.98,
        0,
        1
      );

      // -----------------------------------------------------------------------
      // E. SCENE 3, 4 & 5: 28+ PART EXPLODED DISASSEMBLY & MAGNETIC REASSEMBLY
      // -----------------------------------------------------------------------
      detachableParts.forEach((part, idx) => {
        const explodeT = easeOutExpo(smoothstep(0.33, 0.48, p));

        // Staggered mechanical reassembly groups in Scene 5
        let reStart = 0.75;
        let reEnd = 0.82;
        if (part.snapGroup === 'hilt') {
          reStart = 0.69;
          reEnd = 0.745;
        } else if (part.snapGroup === 'guard') {
          reStart = 0.725;
          reEnd = 0.78;
        } else if (part.snapGroup === 'spine') {
          reStart = 0.755;
          reEnd = 0.805;
        } else if (part.snapGroup === 'edge' || part.snapGroup === 'tip') {
          reStart = 0.78;
          reEnd = 0.822;
        }

        const returnT = easeInExpo(smoothstep(reStart, reEnd, p));
        const netFactor = clamp(explodeT * (1.0 - returnT), 0, 1);

        const slashOrbit = bellPulse(norm(p, 0.48, 0.70)) * netFactor;
        const orbitAngle = p * 24.0 + idx * 0.75;
        const slashOffset = new THREE.Vector3(
          Math.cos(orbitAngle) * 1.05 * slashOrbit,
          Math.sin(orbitAngle * 1.4) * 0.7 * slashOrbit,
          Math.sin(orbitAngle) * 1.05 * slashOrbit
        );

        part.mesh.position.lerpVectors(part.originPos, part.explodedPos, netFactor).add(slashOffset);
        part.mesh.rotation.x = lerp(part.originRot.x, part.explodedRot.x + slashOrbit * 2.4, netFactor);
        part.mesh.rotation.y = lerp(part.originRot.y, part.explodedRot.y + slashOrbit * 3.4, netFactor);
        part.mesh.rotation.z = lerp(part.originRot.z, part.explodedRot.z, netFactor);

        // Wireframe Ghost Afterimages
        const ghostStrength = bellPulse(norm(p, 0.33, 0.68)) + bellPulse(norm(p, reStart, reEnd));
        part.ghosts.forEach((ghost, gIdx) => {
          if (ghostStrength > 0.01) {
            ghost.visible = true;
            ghost.position.copy(part.mesh.position);
            ghost.rotation.copy(part.mesh.rotation);
            ghost.traverse((c) => {
              if (c.isMesh) c.material.opacity = ghostStrength * 0.25;
            });
          } else {
            ghost.visible = false;
          }
        });
      });

      // 64 Swirling Phantom Bankai/Haki Swords (Scene 4 Vortex -> Scene 5 Convergence -> Scene 6 Royal Guard)
      const shardVortexVis =
        smoothstep(0.40, 0.50, p) * (1.0 - smoothstep(0.76, 0.822, p)) +
        smoothstep(0.87, 0.94, p) * 0.72;

      phantomShards.forEach((sh, sIdx) => {
        if (shardVortexVis > 0.01) {
          sh.mesh.visible = true;
          sh.mesh.material.opacity = shardVortexVis * 0.9;
          const conv = smoothstep(0.68, 0.82, p) * (1 - smoothstep(0.86, 0.91, p));
          const curR = lerp(sh.radius, 0.05, easeInExpo(conv));
          const ang = sh.angleOffset + time * sh.speed * 2.4 + p * 34.0;
          const curY = lerp(sh.yOffset + Math.sin(time * 3 + sIdx) * 0.6, 1.2, conv);
          sh.mesh.position.set(Math.cos(ang) * curR, curY, Math.sin(ang) * curR);
          sh.mesh.rotation.set(ang + Math.PI / 2, time * 4, ang);
        } else {
          sh.mesh.visible = false;
        }
      });

      // 60 Gravity-Crushed Levitating Obsidian Haki Debris Rocks
      const rockLift = smoothstep(0.14, 0.58, p);
      hakiDebrisRocks.forEach((rk, rIdx) => {
        const orbitAng = rk.angle + time * 0.35 + p * 10.5 * (rIdx % 2 === 0 ? 1 : -1);
        const shockPush = bellPulse(norm(p, 0.33, 0.42)) * 2.2 + bellPulse(norm(p, 0.815, 0.89)) * 3.8;
        const rad = rk.radius + shockPush;
        const yPos = rk.baseY + rockLift * rk.riseHeight + Math.sin(time * 2.5 + rIdx) * 0.35;

        rk.mesh.position.set(Math.cos(orbitAng) * rad, yPos, Math.sin(orbitAng) * rad);
        rk.mesh.rotation.set(
          time * rk.rotSpeed + p * 12,
          time * rk.rotSpeed * 0.8,
          rIdx
        );
      });
      matHakiRock.emissiveIntensity = 0.25 + rockLift * 0.85 + bellPulse(norm(p, 0.81, 0.87)) * 1.6;

      // Curved Energy Conduits & Traveling Light Packets (Scene 4)
      const conduitAlpha = bellPulse(norm(p, 0.46, 0.72));
      energyConduits.forEach((c, cIdx) => {
        if (conduitAlpha > 0.02) {
          c.tubeMesh.visible = true;
          c.packetSprite.visible = true;
          const pA = detachableParts[c.idxA].mesh.position;
          const pB = detachableParts[c.idxB].mesh.position;
          const mid = pA.clone().lerp(pB, 0.5).add(
            new THREE.Vector3(Math.sin(time * 2 + cIdx) * 1.1, 0.4, Math.cos(time * 2 + cIdx) * 1.1)
          );
          const curve = new THREE.CatmullRomCurve3([pA, mid, pB]);
          c.tubeMesh.geometry.dispose();
          c.tubeMesh.geometry = new THREE.TubeGeometry(curve, 16, 0.022, 6, false);
          c.tubeMesh.material.opacity = conduitAlpha * 0.55;

          const packetT = (time * 1.4 + p * 8.0 + cIdx * 0.21) % 1.0;
          c.packetSprite.position.copy(curve.getPointAt(packetT));
          c.packetSprite.material.opacity = conduitAlpha * 0.95;
        } else {
          c.tubeMesh.visible = false;
          c.packetSprite.visible = false;
        }
      });

      // Whipping 16-Link Pommel Chain
      const pommelPos = pommelGroup.position;
      const windAmp = 0.45 + p * 1.85 + slashFightBlend * 2.4;
      pommelChainLinks.forEach((cl) => {
        const idx = cl.index;
        const wx = Math.sin(time * 7.8 * windAmp - idx * 0.52 + p * 28) * (0.085 * idx);
        const wz = Math.cos(time * 6.5 * windAmp - idx * 0.46 + p * 22) * (0.085 * idx);
        cl.mesh.position.set(pommelPos.x + idx * 0.06 + wx, pommelPos.y - 0.22 - idx * 0.13, pommelPos.z + wz);
        cl.mesh.rotation.set(time * 3.2 + idx * 1.2, wx * 2.5, Math.PI * 0.4 + (idx % 2) * 1.1);
      });

      // -----------------------------------------------------------------------
      // F. SCENE 4: 6 GETSUGA TENSHO CRESCENT SLASHES & DIMENSIONAL CRACKS
      // -----------------------------------------------------------------------
      getsugaSlashes.forEach((sl) => {
        const st = norm(p, sl.cfg.start, sl.cfg.end);
        if (st > 0 && st < 1) {
          sl.mesh.visible = true;
          sl.crackLine.visible = true;
          const pulse = bellPulse(st);
          sl.uniforms.uTime.value = time;
          sl.uniforms.uSlashAlpha.value = pulse;

          const travel = easeOutExpo(st) * 5.6;
          sl.mesh.position.copy(sl.cfg.dir).multiplyScalar(travel - 1.6);
          sl.mesh.scale.setScalar(0.65 + easeOutExpo(st) * 1.55);

          sl.crackLine.position.copy(sl.mesh.position);
          sl.crackLine.material.opacity = pulse * 0.92;
        } else {
          sl.mesh.visible = false;
          sl.crackLine.visible = false;
        }
      });

      // 28 Dual-Core (Pitch-Black Inner Core + Crimson/Magenta Outer Shell) 3D Haki Thunderbolts
      const boltPower =
        Math.pow(Math.max(0, Math.sin(p * 110 + time * 3.5)), 4) * 0.5 +
        bellPulse(norm(p, 0.16, 0.78)) * 0.95 +
        smoothstep(0.80, 0.96, p) * 0.98;

      lightningBolts.forEach((bolt, bIdx) => {
        if (boltPower > 0.03) {
          bolt.line.visible = true;
          bolt.blackCoreLine.visible = true;
          const op = boltPower * (0.5 + Math.random() * 0.5);
          bolt.line.material.opacity = op;
          bolt.blackCoreLine.material.opacity = op * 0.95;

          let pA, pB;
          if (bolt.isSkyBolt) {
            const ang = bolt.skyAngle + time * 0.8 + p * 12;
            pA = new THREE.Vector3(Math.cos(ang) * 3.2, 8.8, Math.sin(ang) * 3.2);
            pB = detachableParts[bolt.partA].mesh.position;
          } else {
            pA = detachableParts[bolt.partA].mesh.position;
            pB = detachableParts[bolt.partB].mesh.position;
          }

          const posAttr = bolt.line.geometry.attributes.position;
          const coreAttr = bolt.blackCoreLine.geometry.attributes.position;

          for (let s = 0; s <= boltSegs; s++) {
            const st = s / boltSegs;
            const jag = s === 0 || s === boltSegs ? 0 : (1 - Math.abs(st - 0.5) * 2) * (bolt.isSkyBolt ? 0.78 : 0.48);
            const vx = lerp(pA.x, pB.x, st) + Math.sin(time * 62 + s * 7 + bIdx) * jag;
            const vy = lerp(pA.y, pB.y, st) + Math.cos(time * 56 + s * 5 + bIdx) * jag;
            const vz = lerp(pA.z, pB.z, st) + Math.sin(time * 48 + s * 3) * jag;
            posAttr.setXYZ(s, vx, vy, vz);
            coreAttr.setXYZ(s, vx, vy, vz + 0.018);
          }
          posAttr.needsUpdate = true;
          coreAttr.needsUpdate = true;
        } else {
          bolt.line.visible = false;
          bolt.blackCoreLine.visible = false;
        }
      });

      // Colossal Sky-to-Ground Conqueror's Haki Thunder Pillar (Scene 5 Final Impact 0.81 -> 0.87)
      const pillarPulse = bellPulse(norm(p, 0.812, 0.875));
      if (pillarPulse > 0.01) {
        thunderPillarGroup.visible = true;
        const pScale = 0.35 + pillarPulse * 1.45 + Math.sin(time * 75) * 0.15;
        thunderPillarGroup.scale.set(pScale, 1, pScale);
        outerPillarMesh.material.opacity = pillarPulse * 0.85;
        innerBlackPillarMesh.material.opacity = pillarPulse * 0.92;
      } else {
        thunderPillarGroup.visible = false;
      }

      // Shockwave Ring & Spherical Bankai Reiatsu Dome (Scene 3 & Scene 5)
      const sepWave = norm(p, 0.335, 0.42);
      const bankaiWave = norm(p, 0.818, 0.915);
      const waveT = sepWave > 0 && sepWave < 1 ? sepWave : bankaiWave > 0 && bankaiWave < 1 ? bankaiWave : 0;

      if (waveT > 0) {
        shockwaveRing.visible = true;
        bankaiDomeMesh.visible = true;
        const sc = 0.6 + easeOutExpo(waveT) * 13.5;
        shockwaveRing.scale.setScalar(sc);
        bankaiDomeMesh.scale.setScalar(sc * 0.68);
        shockwaveRing.material.opacity = (1 - waveT) * 0.95;
        bankaiDomeMesh.material.opacity = (1 - waveT) * 0.58;
      } else {
        shockwaveRing.visible = false;
        bankaiDomeMesh.visible = false;
      }

      // Orbiting Halo Rings & Rotating Arcane Mandala Circles
      const haloAlpha = bellPulse(norm(p, 0.48, 0.70)) * 0.75 + smoothstep(0.84, 0.94, p) * 0.85;
      haloRing1.material.opacity = haloAlpha;
      haloRing2.material.opacity = haloAlpha * 0.8;
      haloRing1.rotation.set(time * 1.4 + p * 8, time * 0.9, 0.6);
      haloRing2.rotation.set(-time * 1.1, time * 1.3 - p * 8, -0.6);

      const mandalaAlpha = bellPulse(norm(p, 0.18, 0.35)) * 0.5 + haloAlpha;
      mandalaBack.material.opacity = clamp(mandalaAlpha, 0, 0.78);
      mandalaFloor.material.opacity = clamp(mandalaAlpha * 0.85, 0, 0.82);
      mandalaBack.rotation.z = time * 0.5 + p * 6.5;
      mandalaFloor.rotation.z = -time * 0.6 - p * 6.5;

      // 900 Swirling Spiritual Embers
      const posArr = vortexGeo.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const s = vortexSeeds[i];
        const ang = s.theta + time * 0.9 * s.speed + p * 14.0;
        const radius = s.r * (1.0 - slashFightBlend * 0.38) + Math.sin(time * 3 + i) * 0.25;
        const y = s.y + ((time * s.speed * 1.5 + p * 10.0) % 11.5) - 5.75;
        posArr[i * 3] = Math.cos(ang) * radius;
        posArr[i * 3 + 1] = y;
        posArr[i * 3 + 2] = Math.sin(ang) * radius;
      }
      vortexGeo.attributes.position.needsUpdate = true;

      corePointLight.intensity = 2.6 + p * 3.8 + activeBurstIntensity * 7.5;
    }

    /***************************************************************************
     * 12. AUDIO BUTTON, RESIZE & 60 FPS RENDER LOOP
     ***************************************************************************/
    document.getElementById('audio-toggle-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      audioEngine.toggle();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      resizeFxCanvas();
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      const prevSmooth = scrollState.smoothProgress;
      scrollState.smoothProgress = lerp(scrollState.smoothProgress, scrollState.targetProgress, 0.14);
      scrollState.velocity = (scrollState.smoothProgress - prevSmooth) * 60;

      const p = clamp(scrollState.smoothProgress, 0, 1);

      hamonUniforms.uTime.value = elapsedTime;
      flameUniforms.uTime.value = elapsedTime;

      evaluateAnimeTimeline(p, elapsedTime);
      renderSakuga2D(p, scrollState.velocity, elapsedTime);
      updateMinimalUI(p);
      audioEngine.updateScroll(p, scrollState.velocity);

      renderer.render(scene, camera);
    }

    window.onload = function () {
      updateMinimalUI(0);
      animate();
    };
  </script>
</body>
</html>
